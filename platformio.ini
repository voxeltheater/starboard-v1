; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Uses the arduino-pico core (earlephilhower) rather than the mbed core: it
; ships an OTA bootloader, which is what lets boards take firmware over DMX
; (see tools/dmx_update.py). The official raspberrypi platform only offers
; mbed, hence the community platform below.
[env:nanorp2040connect]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
; 2 MB flash: 1 MB for the sketch, 1 MB LittleFS to stage incoming updates.
board_build.filesystem_size = 1m
; Fresh on every build, so each firmware.bin gets a distinct FIRMWARE_ID
; (src/main.cpp). Only applies to src/, so the core isn't rebuilt each time.
build_src_flags = !echo "-DFIRMWARE_BUILD_TIME=$(date +%%s)"
lib_deps =
	; Adafruit TLC59711 is vendored in lib/ with a fix for the arduino-pico core
	; (see lib/Adafruit_TLC59711/STARBOARD.md); it still needs BusIO.
	adafruit/Adafruit BusIO@^1.17.0
	jostlowe/Pico-DMX@^3.0.1

; MONO12 boards: same firmware with PCB_MODEL switched. Output lands in
; .pio/build/mono12/. Images carry their model, so boards of the other type
; ignore them over DMX and tools/usb_flash.py refuses to cross-flash.
[env:mono12]
extends = env:nanorp2040connect
build_flags = -DPCB_MODEL=PCB_MONO12
