; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; One build per board type; `pio run` builds RGB12 only. tools/release.sh
; builds all three into firmware/<version>/ for the Starboard Updater app.
[platformio]
default_envs = rgb12

; Shared by every board type.
; Uses the arduino-pico core (earlephilhower) rather than the mbed core: it
; ships an OTA bootloader, which is what lets boards take firmware over DMX.
; The official raspberrypi platform only offers mbed, hence the community
; platform below.
[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
; 2 MB flash: 1 MB for the sketch, 1 MB LittleFS to stage incoming updates.
board_build.filesystem_size = 1m
; Fresh on every build, so each firmware.bin gets a distinct FIRMWARE_ID
; (src/main.cpp). Only applies to src/, so the core isn't rebuilt each time.
build_src_flags = !echo "-DFIRMWARE_BUILD_TIME=$(date +%%s)"
lib_deps =
	; Adafruit TLC59711 is vendored in lib/ with a fix for the arduino-pico core
	; (see lib/Adafruit_TLC59711/STARBOARD.md); it still needs BusIO.
	adafruit/Adafruit BusIO@^1.17.0
	jostlowe/Pico-DMX@^3.0.1

; Images carry their board type, so boards of another type ignore them over
; DMX and the USB flasher refuses to cross-flash.
[env:rgb12]
build_flags = -DPCB_MODEL=PCB_RGB12

[env:mono12]
build_flags = -DPCB_MODEL=PCB_MONO12

[env:mono20]
build_flags = -DPCB_MODEL=PCB_MONO20
