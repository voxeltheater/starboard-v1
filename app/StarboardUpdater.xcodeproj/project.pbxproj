			shellPath = /bin/sh;
			shellScript = "# Copies PlatformIO's picotool (and its libusb) into the app, so the\n# app works on Macs without PlatformIO. picotool: BSD-3-Clause;\n# libusb: LGPL-2.1, used as an unmodified separate library.\nSRC=\"$HOME/.platformio/packages/tool-picotool-rp2040-earlephilhower\"\nDEST=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/picotool\"\nif [ -x \"$SRC/picotool\" ]; then\n  mkdir -p \"$DEST\"\n  cp -f \"$SRC/picotool\" \"$SRC/libusb-1.0.0.dylib\" \"$DEST/\"\n  cp -f \"$SRC/LICENSE.TXT\" \"$DEST/LICENSE-picotool.txt\"\n  codesign --force --sign - \"$DEST/libusb-1.0.0.dylib\" \"$DEST/picotool\"\nelse\n  echo \"warning: picotool not found at $SRC. Build the firmware once with PlatformIO, then rebuild the app; until then USB flashing only works on Macs with PlatformIO or Homebrew picotool.\"\nfi\n";
		};
